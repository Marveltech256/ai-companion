name: ai_companion
description: "Ai Companion — a personal AI companion."
publish_to: 'none'
version: 0.1.4+5

environment:
  sdk: ^3.13.5

dependencies:
  audioplayers: ^6.8.1
  cupertino_icons: ^2.0.0
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  google_sign_in: ^7.2.0
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  flutter:
    sdk: flutter
  http: ^1.6.0
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.5
  path_provider: ^2.1.6
  record: ^7.1.2
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  uuid: ^4.6.0
  url_launcher: ^6.3.2
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/design/
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/Lora-OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora.ttf
